<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미니 2D 파쿠르</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-layout">
      <h1>미니 2D 파쿠르</h1>
      <p>
        <strong>이동:</strong> ← → 또는 A D,
        <strong>점프:</strong> Space / ↑ / W,
        <strong>리셋:</strong> R
      </p>
      <canvas id="game" width="960" height="540" aria-label="2D 파쿠르 게임"></canvas>
      <p id="status" aria-live="polite">도착 지점까지 이동해 보세요!</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
